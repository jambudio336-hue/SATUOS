name: Pemeriksaan SATUOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pasang dependency terkunci
        run: npm ci
      - name: Selaraskan dependency Expo dengan SDK terkunci
        run: npx expo install --fix
      - name: Verifikasi kompatibilitas dependency Expo
        run: npx expo install --check
      - name: Expo Doctor
        run: npx --yes expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Tes otomatis
        run: npm test
      - name: Lint
        run: npm run lint
