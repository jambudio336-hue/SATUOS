name: Build APK Android SATUOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_enabled: ${{ steps.signing-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verifikasi Android SDK runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"
      - name: Pasang dependency terkunci
        run: npm ci
      - name: Periksa kompatibilitas Expo
        run: npx expo install --check
      - name: Expo Doctor
        run: npx --yes expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Tes otomatis
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Prebuild Android
        run: CI=1 npx expo prebuild --platform android
      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: SATUOS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Periksa konfigurasi signing
        id: signing-check
        env:
          SATUOS_KEYSTORE_BASE64: ${{ secrets.SATUOS_KEYSTORE_BASE64 }}
          SATUOS_KEYSTORE_PASSWORD: ${{ secrets.SATUOS_KEYSTORE_PASSWORD }}
          SATUOS_KEY_PASSWORD: ${{ secrets.SATUOS_KEY_PASSWORD }}
        run: |
          if [ -n "$SATUOS_KEYSTORE_BASE64" ] && [ -n "$SATUOS_KEYSTORE_PASSWORD" ] && [ -n "$SATUOS_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK release bertanda tangan
        if: ${{ steps.signing-check.outputs.enabled == 'true' }}
        env:
          SATUOS_KEYSTORE_BASE64: ${{ secrets.SATUOS_KEYSTORE_BASE64 }}
          SATUOS_KEYSTORE_PASSWORD: ${{ secrets.SATUOS_KEYSTORE_PASSWORD }}
          SATUOS_KEY_PASSWORD: ${{ secrets.SATUOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/satuos-release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$SATUOS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$SATUOS_KEYSTORE_PASSWORD" | awk -F': ' '/Alias name:/{print $2; exit}')"
          test -n "$KEY_ALIAS"
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$SATUOS_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SATUOS_KEY_PASSWORD"
      - name: Upload APK release bertanda tangan
        if: ${{ steps.signing-check.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: SATUOS-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.android-apk.outputs.release_enabled == 'true' }}
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unduh APK bertanda tangan
        uses: actions/download-artifact@v4
        with:
          name: SATUOS-release-APK
          path: release
      - name: Publikasikan APK ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          generate_release_notes: true
