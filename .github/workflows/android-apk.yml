name: Build APK Android SATUOS
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      SATUOS_KEYSTORE_BASE64: ${{ secrets.SATUOS_KEYSTORE_BASE64 }}
      SATUOS_KEYSTORE_PASSWORD: ${{ secrets.SATUOS_KEYSTORE_PASSWORD }}
      SATUOS_KEY_ALIAS: ${{ secrets.SATUOS_KEY_ALIAS }}
      SATUOS_KEY_PASSWORD: ${{ secrets.SATUOS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx expo install --check
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests
      - run: npx expo prebuild --platform android --non-interactive
      - name: Build APK debug
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: SATUOS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build APK release bertanda tangan jika rahasia signing tersedia
        if: ${{ env.SATUOS_KEYSTORE_BASE64 != '' && env.SATUOS_KEYSTORE_PASSWORD != '' && env.SATUOS_KEY_ALIAS != '' && env.SATUOS_KEY_PASSWORD != '' }}
        run: |
          echo "$SATUOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satuos-release.keystore"
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$RUNNER_TEMP/satuos-release.keystore" -Pandroid.injected.signing.store.password="$SATUOS_KEYSTORE_PASSWORD" -Pandroid.injected.signing.key.alias="$SATUOS_KEY_ALIAS" -Pandroid.injected.signing.key.password="$SATUOS_KEY_PASSWORD"
      - name: Upload APK release bertanda tangan
        if: ${{ env.SATUOS_KEYSTORE_BASE64 != '' && env.SATUOS_KEYSTORE_PASSWORD != '' && env.SATUOS_KEY_ALIAS != '' && env.SATUOS_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SATUOS-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publikasikan APK release ke GitHub Releases saat tag versi
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SATUOS_KEYSTORE_BASE64 != '' && env.SATUOS_KEYSTORE_PASSWORD != '' && env.SATUOS_KEY_ALIAS != '' && env.SATUOS_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
